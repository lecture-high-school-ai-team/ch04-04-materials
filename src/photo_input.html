<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教材用・写真入力</title>
<style>body{max-width:760px;margin:32px auto;padding:16px;font:18px sans-serif;color:#1b3448}textarea{width:100%;height:160px}img{max-width:320px}button,input{font:inherit;margin:12px 0}</style>
<h1>自分の写真を教材へ入れる</h1><p>画像を選び、できたJSONをコピーしてNotebookの「自分の写真を使う」へ貼り付けます。変換はこのブラウザ内で行います。</p>
<input id="file" type="file" accept="image/*"><br><img id="preview" alt="選んだ写真のプレビュー"><p id="status"></p><textarea id="result" aria-label="Notebookへ貼り付けるJSON" readonly></textarea><br><button id="copy" disabled>JSONをコピー</button>
<script>
document.querySelector('#file').addEventListener('change', async event=>{
 const file=event.target.files[0];if(!file)return;
 try{
  const bitmap=await createImageBitmap(file);
  const canvas=document.createElement('canvas');const scale=Math.min(1,640/Math.max(bitmap.width,bitmap.height));
  canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  const image=canvas.toDataURL('image/png');document.querySelector('#preview').src=image;
  const small=document.createElement('canvas');small.width=32;small.height=32;
  const s=small.getContext('2d');s.drawImage(bitmap,0,0,32,32);
  const rgba=s.getImageData(0,0,32,32).data;const rgb=Array.from(rgba).filter((_,i)=>i%4!==3);
  document.querySelector('#result').value=JSON.stringify({label:'自分の写真',image,rgb});
  document.querySelector('#copy').disabled=false;document.querySelector('#status').textContent='準備できました。';bitmap.close();
 }catch(e){document.querySelector('#status').textContent='画像を読み込めませんでした。JPEGまたはPNGを選んでください。';}
});
document.querySelector('#copy').addEventListener('click',async()=>{
 const text=document.querySelector('#result');text.select();
 try{await navigator.clipboard.writeText(text.value);document.querySelector('#status').textContent='コピーしました。';}
 catch(e){document.querySelector('#status').textContent='選択されたJSONを手動でコピーしてください。';}
});
</script></html>
