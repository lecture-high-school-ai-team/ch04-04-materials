name: repository-check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify lesson material hashes and upload layout
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path
          root = Path('.')
          name = '第4章_第4コマ_教材v11_配布元照合.json'
          raw = (root / name).read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'da2cd1b6ee374fb29a2800d87e9193faf51c355d0c51d104f57325352ddb66fa'
          record = json.loads(raw)
          assert record['unit_id'] == 'ch04-l04' and record['material_version'] == 'v11'
          expected = {name, '.github/workflows/repository-check.yml'}
          for item in record['publication_files']:
              path = root / item['path']
              data = path.read_bytes()
              assert len(data) == item['bytes'], item['path']
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
              expected.add(item['path'])
              if path.suffix == '.py': ast.parse(data.decode())
              if path.suffix == '.ipynb':
                  notebook = json.loads(data)
                  assert notebook['nbformat'] == 4 and len(data) <= 12_000_000
                  assert notebook['metadata']['lesson']['version'] == 11
                  for cell in notebook['cells']:
                      text = ''.join(cell['source'])
                      if cell['cell_type'] == 'code': ast.parse(text)
                      assert 'high-school-ai/blob/ch04-l04-v8/' not in text
          assert {str(p) for p in root.rglob('*') if p.is_file() and '.git' not in p.parts} == expected
          assert not (root / 'GitHub掲載手順.md').exists()
          assert len(list(root.rglob('runtime_bundle.json'))) == 1
          bundle = json.loads((root / 'data/runtime_bundle.json').read_text())
          assert bundle['format'] == 'matsuiwa-materials-v0'
          assert bundle['case'] == json.loads((root / 'data/case.json').read_text())
          assert bundle['app_source'] == (root / 'src/app.py').read_text()
          assert bundle['feature_source'] == (root / 'src/campaign_starter.py').read_text()
          case = bundle['case']
          assert (len(case['places']), len(case['reviews']), len(case['passes']), len(case['photos'])) == (8, 367, 4, 2)
          assert case['search_model'] == json.loads((root / 'data/search/word_vectors.json').read_text())
          print('Validated v11 Notebook, data, and distribution layout; teacher upload guide excluded.')
          PY
